################
# GitLab CI for the Webships Project template (a Composer "project" package).
#
# The drupal.org module and recipe jobs do not apply to a project template, so
# only the templates' variables (images, database) and workflow (merge request
# pipelines) are included. The jobs validate composer.json, then build the
# project from this branch and install Drupal with its installer profile.
# Documentation: https://project.pages.drupalcode.org/gitlab_templates/
################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _TARGET_PHP: '8.5'
  DRUPAL_CORE: '11.4.x-dev'
  COMPOSER_NO_INTERACTION: '1'

default:
  image: $_CONFIG_DOCKERHUB_ROOT/php-$_TARGET_PHP-$_TARGET_PHP_IMAGE_VARIANT:$_TARGET_PHP_IMAGE_TAG
  interruptible: true

stages:
  - validate
  - test

composer validate:
  stage: validate
  script:
    - composer --version
    # The Webship packages use exact x-dev versions on purpose, so no --strict.
    - composer validate

# Build the project from this branch, on Drupal 11.4, and install Drupal.
project:
  stage: test
  needs: []
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: mysql
    MYSQL_USER: drupaltestbot
    MYSQL_PASSWORD: drupaltestbotpw
  # One install per site template.
  parallel:
    matrix:
      - SITE_TEMPLATE: webships_starter
        ENABLED_EXTENSION: webapi
      - SITE_TEMPLATE: webapi_starter
        ENABLED_EXTENSION: webapi
  script:
    - composer require --no-update "drupal/core-recommended:$DRUPAL_CORE"
    - composer update --with-all-dependencies
    # Swagger UI is installed once, in the folder the API documentation loads.
    - test "$(composer show --name-only | grep -c swagger-ui)" -eq 1
    - test -f web/libraries/swagger-ui/dist/swagger-ui-bundle.js
    # Run the Drush PHP script directly: vendor/bin/drush is a shell proxy.
    - export DRUSH="php -d memory_limit=-1 vendor/drush/drush/drush.php"
    # Install the site template from its recipe directory, relative to the Drupal root.
    - $DRUSH site:install ../recipes/$SITE_TEMPLATE -y
      --db-url=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
      --account-name=admin --account-pass=admin
    - $DRUSH status --fields=drupal-version,db-status
    - $DRUSH pm:list --status=enabled --format=list | grep -x "$ENABLED_EXTENSION"
    # The API answers, and stays read-only.
    - $DRUSH config:get jsonapi.settings read_only

# Drupal 12 (beta) on PHP 8.5, with the lenient plugin. Allowed to fail while
# Drupal 12 is a beta and contributed modules catch up.
project (Drupal 12):
  extends: project
  allow_failure: true
  variables:
    _TARGET_PHP: '8.5'
    DRUPAL_CORE: '^12'
  # Install the Drupal 11 default first, so the lenient plugin is active when
  # Composer resolves Drupal 12 (the README's upgrade path).
  before_script:
    - composer install
    # Search left core in Drupal 12: Webships Starter needs the contrib module.
    - composer require --no-update drupal/search:^1
